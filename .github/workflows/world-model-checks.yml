name: World-model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B scripts/check_repo.py
      - run: python -B tools/check_upload_privacy.py --scope git
      - run: python -B -m unittest discover -s apps/r3b-playground -p test_runtime_config.py -v
