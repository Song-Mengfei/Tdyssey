    "opencv-python>=3.0; extra == 'all'",
    "pygame==2.1.0; extra == 'all'",
    "pytest==7.0.1; extra == 'all'",
    "swig==4.*; extra == 'all'",
    "ale-py~=0.8.0; extra == 'atari'",
    "box2d-py==2.3.5; extra == 'box2d'",
    "pygame==2.1.0; extra == 'box2d'",
