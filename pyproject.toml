[project]
name = "tdyssey"
version = "0.1.0"
description = "Course research scaffold for world-model-based cross-shape pushing adaptation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "pillow==11.0.0",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "tqdm==4.66.6",
    "gymnasium==0.29.1",
    "pymunk==6.9.0",
    "pygame==2.6.1",
    "shapely==2.0.6",
    "zarr==2.18.3",
    "numcodecs==0.15.1",
    "huggingface-hub==0.26.2",
]

# Choose exactly one torch backend when installation is authorized.
[project.optional-dependencies]
cpu = ["torch==2.5.1", "torchvision==0.20.1"]
cu124 = ["torch==2.5.1", "torchvision==0.20.1"]
cu128 = ["torch==2.7.1", "torchvision==0.22.1"]
tracking = ["wandb==0.18.7"]
dp = [
    "dill==0.3.9",
    "diffusers==0.31.0",
    "einops==0.8.0",
    "gym==0.26.2",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.10.0.84",
    "robomimic==0.2.0",
    "scikit-image==0.24.0",
]
gpc = [
    "ipython==8.29.0",
    "diffusers==0.31.0",
    "einops==0.8.0",
    "gym==0.26.2",
    "opencv-python-headless==4.10.0.84",
    "scikit-image==0.24.0",
    "scikit-video==1.1.11",
    "wandb==0.18.7",
]

[tool.uv]
package = false
required-version = "==0.13.0"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Static metadata read from the checksum-verified upstream Gym 0.26.2 setup.py.
# Avoids executing its build backend just to resolve dependencies.
[[tool.uv.dependency-metadata]]
name = "gym"
version = "0.26.2"
requires-python = ">=3.6"
requires-dist = [
    "numpy >= 1.18.0",
    "cloudpickle >= 1.2.0",
    "importlib_metadata >= 4.8.0; python_version < '3.10'",
    "gym_notices >= 0.0.4",
    "dataclasses == 0.8; python_version == '3.6'",
    "autorom[accept-rom-license]~=0.4.2; extra == 'accept-rom-license'",
    "ale-py~=0.8.0; extra == 'all'",
    "box2d-py==2.3.5; extra == 'all'",
